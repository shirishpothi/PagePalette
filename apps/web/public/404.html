<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — PagePalette</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #2d4a4a;
      --teal-deep: #1a2f2f;
      --sage: #7a9e7e;
      --cream: #faf8f3;
      --warm-white: #fffef9;
      --terracotta: #c4785a;
      --gold: #c9a959;
      --text: #1a1a1a;
      --text-muted: #5a5a5a;
      --speckle-1: #d4c4b0;
      --speckle-2: #8fb4c9;
      --speckle-3: #c98b8b;
      --speckle-4: #9ab88f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

    /* Speckled texture overlay */
    .speckle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
      background-image: 
        radial-gradient(circle at 20% 30%, var(--speckle-1) 1px, transparent 1px),
        radial-gradient(circle at 80% 20%, var(--speckle-2) 1.5px, transparent 1.5px),
        radial-gradient(circle at 40% 70%, var(--speckle-3) 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, var(--speckle-4) 1px, transparent 1px),
        radial-gradient(circle at 10% 80%, var(--speckle-2) 1px, transparent 1px),
        radial-gradient(circle at 90% 85%, var(--speckle-1) 1.5px, transparent 1.5px),
        radial-gradient(circle at 55% 15%, var(--speckle-3) 1px, transparent 1px),
        radial-gradient(circle at 30% 50%, var(--speckle-4) 1px, transparent 1px);
      background-size: 200px 200px;
    }

    /* Grain overlay */
    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .error-page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 24px;
      min-height: 100vh;
    }

    /* Logo */
    .logo {
      width: 120px;
      margin-bottom: 48px;
      animation: fadeSlideDown 0.8s ease-out 0.1s both;
    }

    /* Notebook visual element */
    .notebook-visual {
      position: relative;
      margin-bottom: 40px;
      animation: fadeSlideDown 0.8s ease-out 0.2s both;
    }

    .page-number {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(8rem, 25vw, 14rem);
      font-weight: 600;
      color: var(--teal-deep);
      line-height: 1;
      letter-spacing: -0.02em;
      position: relative;
    }

    .page-number::after {
      content: '';
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--sage), transparent);
      opacity: 0.5;
    }

    /* Torn page effect */
    .torn-edge {
      position: absolute;
      right: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 70%;
      background: repeating-linear-gradient(
        180deg,
        var(--sage) 0px,
        var(--sage) 8px,
        transparent 8px,
        transparent 12px
      );
      opacity: 0.4;
    }

    /* Content */
    .error-content {
      max-width: 480px;
    }

    .error-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 600;
      color: var(--teal-deep);
      margin-bottom: 16px;
      animation: fadeSlideDown 0.8s ease-out 0.4s both;
    }

    .error-description {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      animation: fadeSlideDown 0.8s ease-out 0.5s both;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      animation: fadeSlideDown 0.8s ease-out 0.6s both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--teal);
      color: var(--cream);
    }

    .btn-primary:hover {
      background: var(--teal-deep);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45, 74, 74, 0.2);
    }

    .btn-secondary {
      background: transparent;
      color: var(--teal);
      border: 1.5px solid var(--teal);
    }

    .btn-secondary:hover {
      background: var(--teal);
      color: var(--cream);
      transform: translateY(-2px);
    }

    /* Arrow icon */
    .btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .btn-primary:hover svg {
      transform: translateX(-3px);
    }

    .btn-secondary:hover svg {
      transform: translateX(3px);
    }

    /* Tagline */
    .tagline {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--sage);
      animation: fadeSlideUp 0.8s ease-out 0.8s both;
    }

    /* Animations */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .error-page {
        padding: 40px 20px 100px;
      }

      .logo {
        width: 100px;
        margin-bottom: 32px;
      }

      .notebook-visual {
        margin-bottom: 32px;
      }

      .button-group {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .tagline {
        bottom: 24px;
        font-size: 1rem;
        width: 100%;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <div class="speckle-bg"></div>
  <div class="grain"></div>

  <main class="error-page">
    <a href="/">
      <img src="logo.png" alt="PagePalette" class="logo">
    </a>

    <div class="notebook-visual">
      <span class="page-number">404</span>
      <div class="torn-edge"></div>
    </div>

    <div class="error-content">
      <h1 class="error-title">You've run out of pages</h1>
      <p class="error-description">
        The page you're looking for doesn't exist in this notebook. 
        It might have been moved, or perhaps it was never written.
      </p>

      <div class="button-group">
        <a href="/" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Home
        </a>
        <a href="mailto:shirish.pothi.27@nexus.edu.sg" class="btn btn-secondary">
          Contact Us
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>

    <p class="tagline">Sustainable. Modular. Yours.</p>
  </main>
</body>
</html>
